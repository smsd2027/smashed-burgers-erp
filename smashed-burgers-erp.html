<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smashed Burgers ERP</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2a2a2a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Smashed ERP"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Serif:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f1f0ec;--ink:#232323;--card:#fff;--line:#e4e1da;--mu:#f5a800;--mu2:#e09b00;--red:#c0392b;--grn:#2c7a4b;--mut:#6e6e68;--side:#2a2a2a;--soft:#faf8f3}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1c;--ink:#ececec;--card:#2a2a2a;--line:#3d3d3d;--mut:#a9a9a1;--side:#141414;--soft:#303030}}
*{box-sizing:border-box}
body{margin:0;display:flex;min-height:100vh;font:14px/1.5 "Roboto Serif",Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
h2,h3{font-family:inherit;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
nav{width:218px;background:var(--side);color:#d4d4d0;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 0;overflow-y:auto}
.lg{margin:0 16px 14px;cursor:pointer;border-radius:8px}.lg:hover img{outline:2px solid var(--mu)}.lg:focus-visible{outline:2px solid var(--mu)}.lg img{width:100%;display:block;border-radius:8px}.lg small{display:block;color:#8d8d86;font-size:11px;margin-top:6px;text-align:center;letter-spacing:.08em;text-transform:uppercase}
nav a{display:flex;align-items:center;gap:11px;padding:10px 18px;cursor:pointer;border-left:4px solid transparent;font-weight:500}
nav a svg{width:19px;height:19px;flex:none}nav a:hover{background:#ffffff12;color:#fff}nav a.on{border-left-color:var(--mu);background:#ffffff1a;color:var(--mu)}
.bk{margin:auto 16px 0;padding-top:14px;display:grid;gap:6px;font-size:12px;color:#9a9a93}.bk button{background:#ffffff1a;color:#fff;border:0;padding:8px;border-radius:6px;cursor:pointer;font:inherit}.bk button:hover{background:#ffffff2e}.bk .who{color:#fff;font-weight:600}.bk .warn{color:#ffb4a8}
.meter{height:5px;background:#ffffff22;border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:var(--mu)}
main{flex:1;padding:24px 28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.top h2{margin:0;font-size:27px;line-height:1.15}.top h2:after{content:"";display:block;width:48px;height:4px;background:var(--mu);margin-top:6px}.top p{margin:6px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0000000f;overflow-x:auto}.card>h3,details>summary{margin:0 0 10px;font-size:17px}
details>summary{cursor:pointer;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0}details[open]>summary{margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--mu);border-radius:10px;padding:12px 14px}.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.stat b{display:block;font-size:21px;margin-top:2px;white-space:nowrap}
table{border-collapse:collapse;width:100%}th{background:var(--side);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;text-align:left;white-space:nowrap}th:first-child{border-radius:6px 0 0 6px}th:last-child{border-radius:0 6px 6px 0}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td.r,th.r{text-align:right}tr:hover td{background:var(--soft)}tfoot td{font-weight:700;border-top:2px solid var(--mu);background:var(--soft)}tr.sec td{background:#f5a80026;font-weight:700}td.empty{text-align:center;color:var(--mut);padding:26px;white-space:normal}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}input:focus,select:focus{outline:2px solid var(--mu);border-color:var(--mu)}
td input{width:96px;text-align:right}td input.w{width:150px;text-align:left}
.b{font:inherit;font-weight:700;background:var(--mu);color:#232323;border:0;padding:8px 15px;border-radius:6px;cursor:pointer}.b:hover{background:var(--mu2)}
.b2{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:6px;cursor:pointer}.b2:hover{border-color:var(--mu);background:#f5a8001a}
button:disabled{opacity:.45;cursor:not-allowed}button.x{background:none;border:0;color:var(--red);cursor:pointer;font-size:15px}
.f{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}.f label{display:grid;gap:3px;color:var(--mut);font-size:12px;font-weight:600}.seg{display:flex;gap:6px}
.neg{color:var(--red)}.pos{color:var(--grn)}.note{color:var(--mut);font-size:12px;margin:8px 0 0}.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#f5a8002e}
.dbars{display:flex;align-items:flex-end;gap:4px;height:140px}.dbars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.dbars i{display:block;width:100%;background:var(--mu);border-radius:3px 3px 0 0;min-height:2px}.dbars span{font-size:10px;color:var(--mut)}
#lo{position:fixed;inset:0;background:#2a2a2a;display:none;align-items:center;justify-content:center;z-index:99;padding:16px}#lo div{width:min(340px,100%);display:grid;gap:10px;color:#cfd7e0}#lo img{width:100%;border-radius:8px}#lo input{width:100%;padding:11px;font-size:15px;background:#fff;color:#000;border:0}#lo button{padding:11px;border:0;border-radius:6px;background:#f5a800;color:#232323;font-weight:700;font-size:15px;cursor:pointer}#pm{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:98;padding:16px}#pm>div{background:var(--card);padding:22px;border-radius:12px;width:min(390px,100%);display:grid;gap:11px;border-top:5px solid var(--mu)}#pm label{display:grid;gap:3px;font-size:12px;color:var(--mut);font-weight:600}#pm input,#pm select{width:100%}
#zm{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:97;padding:20px;cursor:zoom-out}#zm img{max-width:100%;max-height:100%;border-radius:6px}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.rc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}.rc.done{opacity:.72}
.rimg{background:#2a2a2a;height:210px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}.rimg img{max-width:100%;max-height:100%;object-fit:contain}.rimg span{color:#8d8d86;font-size:12px}
.rb{padding:10px;display:grid;gap:7px}.rb input:not([type=checkbox]),.rb select{width:100%}.rb .rt{display:flex;justify-content:space-between;align-items:center;gap:8px}.stars{color:var(--mu);letter-spacing:2px;font-size:17px;white-space:nowrap}.tag{font-size:12px;color:var(--mut)}
#lo .pw{position:relative;display:block}#lo .pw input{padding-right:70px}#lo .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;padding:6px 11px;background:#2a2a2a;color:#fff;font-size:12px;font-weight:600}#lo p{margin:0;color:#ff9a8a;min-height:1.3em}
#ts{position:fixed;right:20px;bottom:20px;background:#2a2a2a;color:#fff;border-left:5px solid var(--mu);padding:10px 16px;border-radius:6px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:50}#ts.on{opacity:1;transform:none}
input:disabled,select:disabled{opacity:1;background:transparent;border-color:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink)}button.x:disabled{display:none}body.ro .adm{display:none}body.lim .ao{display:none}.pill.okp{background:#2c7a4b26;color:var(--grn)}.pill.bad{background:#c0392b26;color:var(--red)}.top .seg{flex:none}.sales-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.sales-switch button{min-width:150px;padding:11px 18px;border-radius:8px;font-weight:800}.sales-switch button.active{background:var(--side);color:#fff;border:2px solid var(--mu)}.sales-switch button:not(.active){background:var(--card);color:var(--ink);border:1px solid var(--line)}.sales-switch small{display:block;font-weight:400;opacity:.8}
.ph,.ps,.sg{display:none}
@page{size:A4;margin:12mm}
@media(max-width:820px){body{display:block}nav{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;overflow-x:auto;padding:6px 8px;gap:2px}.lg{flex:none;width:88px;margin:0 8px 0 0}.lg small{display:none}nav a{flex:none;border-left:0;border-bottom:3px solid transparent;padding:8px 10px;white-space:nowrap}nav a.on{border-bottom-color:var(--mu)}.bk{flex:none;margin:0 0 0 8px;padding:0;display:flex;align-items:center;gap:6px}.bk span:not(.who),.bk .meter{display:none}.bk button{white-space:nowrap;padding:7px 10px}main{padding:14px}.top h2{font-size:22px}}
@media print{.rg{grid-template-columns:repeat(3,1fr)}.rimg{height:150px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rc{break-inside:avoid;border:1px solid #999}.rb input,.rb select{text-align:left}#zm{display:none!important}:root{--bg:#fff;--ink:#000;--card:#fff;--line:#999;--mut:#333;--soft:#fff;--side:#222}nav,.np,#ts{display:none!important}body{display:block;background:#fff;color:#000;font-size:11px}main{padding:0}
.ph{display:flex;align-items:center;gap:12px;border-bottom:3px solid #f5a800;margin-bottom:12px;padding-bottom:8px}.ph img{height:52px;background:#2a2a2a;border-radius:6px}.ph b{font:800 20px "Roboto Serif",Georgia,serif;letter-spacing:.04em;text-transform:uppercase;display:block}.ph span{color:#333}.top{display:none}
.ps{display:table-cell;width:120px}td.ps{height:28px}.card,.stat{border:0;padding:0;box-shadow:none;overflow:visible;margin-bottom:10px}.stats{grid-template-columns:repeat(3,1fr)}.stat{border:1px solid #999;padding:6px}
th,td{white-space:normal;padding:3px 5px;border-bottom:1px solid #bbb}th{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{page-break-inside:avoid}tr:hover td{background:none}
input,select{border:0!important;background:none!important;padding:0!important;width:auto!important;-webkit-appearance:none;appearance:none;color:#000;font:inherit;text-align:right;outline:0!important}td input.w{text-align:left}
tr.sec td{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.neg{color:#a00}.pos{color:#060}.dbars i{background:#888;-webkit-print-color-adjust:exact;print-color-adjust:exact}details{display:block}details>summary{display:none}
.note{display:none}td select{text-align:left}.slip{display:flex;flex-direction:column;min-height:225mm}.slip .sg{margin-top:auto}.sg{display:flex;gap:48px;margin-top:90px;page-break-inside:avoid}.sg div{flex:1;border-top:1.5px solid #000;padding-top:5px;text-align:center;font-weight:600}.sg small{display:block;font-weight:400;color:#444}}

function cpx(){const y=+M.slice(0,4),m=+M.slice(5),pm=m>1?y+'-'+String(m-1).padStart(2,'0'):(y-1)+'-12';if(!S.ex[pm])return alert('No expenses saved for '+pm+'.');if(S.ex[M]&&!confirm('Replace the amounts already entered for '+M+'?'))return;S.ex[M]=JSON.parse(JSON.stringify(S.ex[pm]));save();toast('Copied');r()}
let XT='b',CK='';const books=()=>S.br;
function expn(){return`<div class="seg np" style="margin-bottom:14px"><button class="${XT=='b'?'b':'b2'} vc" onclick="XT='b';r()">Bills and rent</button><button class="${XT=='c'?'b':'b2'} vc" onclick="XT='c';r()">Expense from cash</button></div>`+(XT=='b'?bills():cash())}
const srt=(a,b)=>a.x.d<b.x.d?-1:a.x.d>b.x.d?1:a.i-b.i;
function cash(){if(!books().includes(CK))CK=books()[0];const mk=A=>A.map((x,i)=>({x,i})).filter(o=>o.x.d.startsWith(M)&&o.x.k==CK).sort(srt),ce=mk(S.cx),cn=mk(S.ci),te=sum(ce,o=>o.x.a),ti=sum(cn,o=>o.x.a),dd=today().startsWith(M)?today():M+'-01',
all=books().map(k=>({k,e:sum(S.cx.filter(x=>x.k==k&&x.d.startsWith(M)),x=>x.a),i:sum(S.ci.filter(x=>x.k==k&&x.d.startsWith(M)),x=>x.a)}));
return`<div class=card><div class=f>${mon()}<label>Cash book<select class=vc onchange="CK=this.value;r()">${opts(books(),CK)}</select></label></div>
<div class=stats style="margin-bottom:0"><div class=stat><span>Cash in · ${E(CK)}</span><b>${fm(ti)}</b></div><div class=stat><span>Cash expense</span><b>${fm(te)}</b></div><div class=stat><span>Cash balance</span><b class=${cl(ti-te)}>${fm(ti-te)}</b></div></div></div>
<div class="card adm np"><h3>Add to ${E(CK)}</h3><div class=f><label>Date<input id=cxd type=date value="${dd}"></label><label>Purpose<input id=cxp list=cp placeholder="What was it for?" style="width:240px"></label><datalist id=cp>${[...new Set(S.cx.map(x=>x.p).filter(Boolean))].map(p=>`<option>${E(p)}`).join('')}</datalist><label>Amount (Tk)<input id=cxa type=number></label><button class=b onclick="addCx()">Add cash expense</button></div>
<div class=f><label>Date<input id=cnd type=date value="${dd}"></label><label>Note (optional)<input id=cnn style="width:240px"></label><label>Cash in (Tk)<input id=cna type=number></label><button class=b onclick="addCn()">Add daily cash in</button></div></div>
<div class=card><h3>Cash expenses · ${E(CK)} · ${M}</h3><table><tr><th>#</th><th>Date</th><th>Purpose</th><th class=r>Amount</th><th class=np></th></tr>${ce.map((o,k)=>`<tr><td>${k+1}</td><td>${o.x.d}</td><td><input value="${E(o.x.p)}" placeholder="Purpose" style="width:260px;text-align:left" onchange="cxe(${o.i},'p',this.value)"></td><td class=r><input type=number value="${o.x.a}" onchange="cxe(${o.i},'a',this.value)"></td><td class=np><button class=x onclick="if(confirm('Delete this entry?')){S.cx.splice(${o.i},1);save();r()}">✕</button></td></tr>`).join('')||'<tr><td colspan=5 class=empty>No cash expenses for this month yet.</td></tr>'}${ce.length?`<tfoot><tr><td colspan=3>Total cash expense</td><td class=r>${fm(te)}</td><td class=np></td></tr></tfoot>`:''}</table></div>
<div class=card><h3>Daily cash inflow · ${E(CK)} · ${M}</h3><table><tr><th>#</th><th>Date</th><th>Note</th><th class=r>Cash in</th><th class=np></th></tr>${cn.map((o,k)=>`<tr><td>${k+1}</td><td>${o.x.d}</td><td><input value="${E(o.x.n||'')}" style="width:260px;text-align:left" onchange="cne(${o.i},'n',this.value)"></td><td class=r><input type=number value="${o.x.a}" onchange="cne(${o.i},'a',this.value)"></td><td class=np><button class=x onclick="if(confirm('Delete this entry?')){S.ci.splice(${o.i},1);save();r()}">✕</button></td></tr>`).join('')||'<tr><td colspan=5 class=empty>No cash in for this month yet.</td></tr>'}${cn.length?`<tfoot><tr><td colspan=3>Total cash in</td><td class=r>${fm(ti)}</td><td class=np></td></tr></tfoot>`:''}</table></div>
<div class=card><h3>All cash books · ${M}</h3><table><tr><th>Cash book</th><th class=r>Cash in</th><th class=r>Cash expense</th><th class=r>Balance</th></tr>${all.map(x=>`<tr><td>${E(x.k)}</td><td class=r>${fm(x.i)}</td><td class=r>${fm(x.e)}</td><td class="r ${cl(x.i-x.e)}">${fm(x.i-x.e)}</td></tr>`).join('')}<tfoot><tr><td>Total</td><td class=r>${fm(sum(all,x=>x.i))}</td><td class=r>${fm(sum(all,x=>x.e))}</td><td class=r>${fm(sum(all,x=>x.i-x.e))}</td></tr></tfoot></table><p class=note>The cash book is a separate record of cash coming in and going out. It is not added to the expense on the Dashboard, so nothing is counted twice.</p></div>`}
const addCx=()=>{const a=n(g('cxa'));if(!a)return alert('Enter the amount.');S.cx.push({d:g('cxd'),k:CK,p:g('cxp').trim(),a});save();toast('Saved');r()};
const addCn=()=>{const a=n(g('cna'));if(!a)return alert('Enter the cash in amount.');S.ci.push({d:g('cnd'),k:CK,a,n:g('cnn').trim()});save();toast('Saved');r()};
const cxe=(i,f,v)=>{S.cx[i][f]=f=='a'?n(v):v.trim();save();r()},cne=(i,f,v)=>{S.ci[i][f]=f=='a'?n(v):v.trim();save();r()};
/* ---------- Inventory ---------- */
let IF=today().slice(0,8)+'01',IT=today(),IQ='',IS='a',RD=today();
const rgI=k=>{const t=new Date();if(k==0){IF=ld(new Date(t.getFullYear(),t.getMonth(),1));IT=today()}else if(k==1){IF=ld(new Date(t.getFullYear(),t.getMonth()-1,1));IT=ld(new Date(t.getFullYear(),t.getMonth(),0))}else{IF=ld(new Date(t-29*864e5));IT=today()}r()};
const up=()=>{const a=n(g('rq')),t=n(g('rt'));document.getElementById('up').textContent=a>0&&t>0?'Unit price: '+(t/a).toFixed(2)+' Tk':''};
function inv(){const rc=S.rc.map((x,i)=>({x,i})).filter(o=>o.x.d>=IF&&o.x.d<=IT&&o.x.i.toLowerCase().includes(IQ.toLowerCase())).sort((a,b)=>a.x.d<b.x.d?-1:a.x.d>b.x.d?1:a.i-b.i),ord=[];rc.forEach(o=>{if(!ord.includes(o.x.i))ord.push(o.x.i)});
let R=ord.map(nm=>{const it=S.items.find(i=>i.n==nm)||{n:nm,c:'',u:'',p:0},a=rc.filter(o=>o.x.i==nm).map(o=>o.x),qr=sum(a,x=>x.q),st=stockAt(it,IT);return{it,qr,vr:sum(a,tv),qd:sum(S.dp.filter(x=>x.i==nm&&x.d>=IF&&x.d<=IT),dq),st,sv:Math.max(0,st)*it.p}});
const fn={n:x=>x.it.n.toLowerCase(),s:x=>x.st,v:x=>x.vr}[IS[0]];if(fn){const d=IS[1]=='-'?-1:1;R.sort((a,b)=>{const u=fn(a),v=fn(b);return(u>v?1:u<v?-1:0)*d})}
return`<div class="card adm np"><h3>Add stock received</h3><div class=f><label>Date received<input id=rd type=date value="${RD}"></label><label>Item<input id=ri list=il placeholder="Start typing"></label><datalist id=il>${S.items.map(i=>`<option>${E(i.n)}`).join('')}</datalist><label>Quantity<input id=rq type=number step=any oninput="up()"></label><label>Total value (Tk)<input id=rt type=number step=any oninput="up()"></label><label>Vendor<select id=rv><option value="">Choose vendor</option>${opts(S.vd.map(v=>v.n))}</select></label><button class=b onclick="addR()">Add to stock</button><span id=up class=note></span></div>
<details><summary>Item not in the list? Create it</summary><div class=f><label>Item name<input id=ni></label><label>Category<select id=nc>${opts(['GROCERY','MEAT','VEGGIES','BAKERY','BAR','OTHERS'])}</select></label><label>Unit<input id=nn size=6 placeholder="kg, pcs"></label><button class=b2 onclick="addI()">Create item</button></div></details></div>
<div class=card><div class=f><label>From<input class=vc type=date value="${IF}" onchange="IF=this.value||IF;r()"></label><label>To<input class=vc type=date value="${IT}" onchange="IT=this.value||IT;r()"></label><div class="seg np"><button class="b2 vc" onclick="rgI(0)">This month</button><button class="b2 vc" onclick="rgI(1)">Last month</button><button class="b2 vc" onclick="rgI(2)">Last 30 days</button></div><label>Sort by<select class=vc onchange="IS=this.value;r()"><option value=a${IS=='a'?' selected':''}>Order added</option><option value="n+"${IS=='n+'?' selected':''}>Name A to Z</option><option value="s+"${IS=='s+'?' selected':''}>Stock low to high</option><option value="s-"${IS=='s-'?' selected':''}>Stock high to low</option><option value="v-"${IS=='v-'?' selected':''}>Value received high to low</option></select></label><label>Search<input id=isq class=vc value="${E(IQ)}" oninput="IQ=this.value;r()"></label></div>
<div class=stats style="margin-bottom:0"><div class=stat><span>Items received</span><b>${R.length}</b></div><div class=stat><span>Value received</span><b>${fm(sum(R,x=>x.vr))}</b></div><div class=stat><span>Stock value on ${IT}</span><b>${fm(sum(R,x=>x.sv))}</b></div></div></div>
<div class=card><h3>Items received · stock after dispatch</h3><table><tr><th>#</th><th>Item</th><th>Unit</th><th class=r>Received</th><th class=r>Total value</th><th class=r>Avg unit price</th><th class=r>Dispatched</th><th class=r>Stock on ${IT}</th><th class=r>Stock value</th></tr>${R.map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.it.n)}</td><td>${E(x.it.u)}</td><td class=r>${+x.qr.toFixed(2)}</td><td class=r>${fm(x.vr)}</td><td class=r>${x.qr?(x.vr/x.qr).toFixed(2):'-'}</td><td class=r>${+x.qd.toFixed(2)}</td><td class="r ${x.st<0?'neg':''}"><b>${+x.st.toFixed(2)}</b></td><td class=r>${fm(x.sv)}</td></tr>`).join('')||'<tr><td colspan=9 class=empty>Nothing received in this date range. Use "Add stock received" above.</td></tr>'}${R.length?`<tfoot><tr><td></td><td colspan=3>Total</td><td class=r>${fm(sum(R,x=>x.vr))}</td><td colspan=3></td><td class=r>${fm(sum(R,x=>x.sv))}</td></tr></tfoot>`:''}</table><p class=note>Stock = everything received up to the "To" date minus everything dispatched up to that date.</p></div>
<div class=card><h3>Stock-in entries · ${IF} to ${IT}</h3><table><tr><th>#</th><th>Date</th><th>Item</th><th class=r>Quantity</th><th class=r>Total value</th><th class=r>Unit price</th><th>Vendor</th><th class=np></th></tr>${rc.map((o,k)=>`<tr><td>${k+1}</td><td>${o.x.d}</td><td>${E(o.x.i)}</td><td class=r>${o.x.q}</td><td class=r>${fm(tv(o.x))}</td><td class=r>${(tv(o.x)/o.x.q).toFixed(2)}</td><td>${E(o.x.v)}</td><td class=np><button class=x onclick="if(confirm('Delete this stock-in entry?')){S.rc.splice(${o.i},1);save();r()}">✕</button></td></tr>`).join('')||'<tr><td colspan=8 class=empty>No entries in this range.</td></tr>'}</table></div>`}
function addR(){const it=S.items.find(i=>i.n==g('ri').trim()),qn=n(g('rq')),t=n(g('rt')),d=g('rd');if(!it||!qn||!t||!d||!g('rv'))return alert('Choose the date, an item from the list, the quantity, the total value and the vendor.');if(!S.rc.some(x=>x.i==it.n&&x.d>d))it.p=t/qn;S.rc.push({d,i:it.n,q:qn,t,p:t/qn,v:g('rv')});RD=d;save();toast('Stock added');r()}

return`<div class=stats><div class=stat><span>Total due</span><b class=${sum(R,x=>x.d)>0?'neg':'pos'}>${fm(sum(R,x=>x.d))}</b></div><div class=stat><span>Total received</span><b>${fm(sum(R,x=>x.r))}</b></div><div class=stat><span>Total paid</span><b>${fm(sum(R,x=>x.p))}</b></div></div>
