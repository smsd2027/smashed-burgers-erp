.dsp-body{display:flex;gap:5mm;align-items:flex-start;flex:1 1 auto;min-height:0}
.dsp-body table{flex:1 1 0;min-width:0;width:100%;table-layout:fixed;border-collapse:collapse;font-size:var(--dfs)}
.dsp-body th{background:#2a2a2a!important;color:#fff;font-size:calc(var(--dfs) - 1pt);text-transform:uppercase;letter-spacing:.04em;text-align:left;height:6.5mm;padding:0 1.5mm;border:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dsp-body td{height:var(--drh);padding:0 1.5mm;border-bottom:.2mm solid #888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.dsp *{box-sizing:border-box}.dsp-body table{border-spacing:0}.dsp-body th{border-radius:0}.dsp-body.cols td,.dsp-body.cols th{padding:0 1mm}.dsp-body.cols .bx{width:3mm;height:3mm}.dsp-body .r{text-align:right}.dsp-body .c{text-align:center}
.dsp-body .bx{display:inline-block;width:3.4mm;height:3.4mm;border:.3mm solid #000;vertical-align:middle}
.dsp-sg{display:flex;gap:8mm;flex:none;margin-top:5mm}
.dsp-sg>div{flex:1;height:36mm;border:.35mm solid #000;display:flex;flex-direction:column;break-inside:avoid}
.dsp-sg h4{margin:0;background:#2a2a2a;color:#fff;padding:1.6mm 3mm;font:700 8.5pt Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dsp-sg .ln{display:flex;align-items:flex-end;gap:2mm;flex:1;padding:0 3mm 2mm;font-size:8pt;color:#333}
.dsp-sg .ln i{flex:1;border-bottom:.25mm solid #000;height:0}

document.querySelectorAll('img[data-iid]').forEach(async im=>{try{const u=await imgUrl(im.dataset.iid);if(u){im.src=u;if(im.nextElementSibling)im.nextElementSibling.remove()}else if(im.nextElementSibling)im.nextElementSibling.textContent='Picture not found'}catch(e){if(im.nextElementSibling)im.nextElementSibling.textContent='Picture not found'}});
if(fid){const e=document.getElementById(fid);if(e&&e!==document.activeElement){e.focus();if(pos!=null&&e.setSelectionRange)try{e.setSelectionRange(pos,pos)}catch(x){}}}else if(fi>=0){const e=document.querySelectorAll('#main input,#main select')[fi];if(e&&!e.disabled&&e!==document.activeElement)e.focus()}}
async function bak(){S.lb=today();save();const o=Object.assign({},S);const imgs=[...S.rv,...S.wa].filter(x=>x.im);if(imgs.length){o._img={};for(const x of imgs){try{const b=await imgBlob(x.im);if(b)o._img[x.im]=await new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.readAsDataURL(b)})}catch(e){}}}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='erp-backup-'+today()+'.json';a.click();r()}
function res(f){if(!f)return;f.text().then(async t=>{try{const d=JSON.parse(t);if(!d.items||!d.st)throw 0;if(!confirm('Replace ALL current data with this backup? A backup of the current data will download first.'))return;await bak();const im=d._img||{};delete d._img;S=d;mig();
for(const [id,u] of Object.entries(im)){const bin=atob(u.split(',')[1]),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);await imgPut(id,new Blob([arr],{type:'image/jpeg'}))}
save();toast('Backup restored');r()}catch(e){alert('That file is not an ERP backup.')}})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
start();
